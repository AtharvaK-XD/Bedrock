<!doctype html>
<html lang="en" class="bg-basalt-800 text-sandstone-100">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-tight.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700;6..96,900&display=swap" rel="stylesheet">
    <title>Bedrock</title>
    <script>
      (function() {
        try {
          var isPopup = 
            window.name === 'BedrockOAuth' || 
            (window.sessionStorage && window.sessionStorage.getItem('bedrock_auth_popup') === '1') ||
            (window.location.search && window.location.search.indexOf('popup=1') !== -1);
          var path = window.location.pathname;
          if (isPopup && path !== '/popup-auth' && path !== '/sso-callback') {
            try {
              if (window.opener) {
                window.opener.postMessage('clerk-auth-complete', '*');
              }
              if (window.localStorage) {
                window.localStorage.setItem('bedrock_auth_event', Date.now().toString());
              }
              if (window.sessionStorage) {
                window.sessionStorage.removeItem('bedrock_auth_popup');
              }
            } catch (e) {}
            window.close();
            setTimeout(function() { window.close(); }, 50);
            setTimeout(function() { window.close(); }, 200);
          }
        } catch (err) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
