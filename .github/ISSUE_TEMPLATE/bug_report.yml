name: 🐛 Bug Report
description: File a bug report to help us improve Bedrock
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues before submitting to avoid duplicates.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: A clear and concise summary of the bug
      placeholder: "e.g. ApiKeyGatewayModal fails to save OpenAI key on Windows desktop"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: What steps did you take before encountering the issue?
      placeholder: |
        1. Open Bedrock Desktop app
        2. Navigate to Settings -> API Keys
        3. Enter Gemini API key and click 'Save'
        4. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Platform
      description: Which environment are you running Bedrock on?
      options:
        - Windows (Desktop App)
        - macOS (Desktop App)
        - Linux (Desktop App)
        - Web Browser (Vercel)
        - Local Node / Vite Dev Server
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Screenshots or Console Logs
      description: Paste any error messages, terminal output, or drag-and-drop screenshots here.
