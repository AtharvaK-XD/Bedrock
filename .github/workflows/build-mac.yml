name: Build macOS Desktop Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'dist-electron/**'
      - '.github/workflows/build-mac.yml'

jobs:
  build-mac:
    name: Build & Package macOS DMG
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web application
        run: npm run build

      - name: Package macOS Desktop App (Electron)
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Organize macOS Release Assets
        run: |
          mkdir -p release-mac-artifacts
          DMG_FILE=$(find release -name "*.dmg" | head -n 1)
          ZIP_FILE=$(find release -name "*.zip" | head -n 1)
          
          if [ -n "$DMG_FILE" ]; then
            cp "$DMG_FILE" release-mac-artifacts/Bedrock-Mac.dmg
            echo "Copied $DMG_FILE to release-mac-artifacts/Bedrock-Mac.dmg"
          fi
          
          if [ -n "$ZIP_FILE" ]; then
            cp "$ZIP_FILE" release-mac-artifacts/Bedrock-Mac.zip
            echo "Copied $ZIP_FILE to release-mac-artifacts/Bedrock-Mac.zip"
          fi
          
          ls -la release-mac-artifacts/

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-macos-installer
          path: release-mac-artifacts/*

      - name: Attach macOS Assets to Dedicated macOS GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0-mac
          name: "Bedrock v1.2.0 - macOS Desktop Workstation"
          make_latest: false
          body: |
            # Bedrock v1.2.0 - macOS Desktop Workstation

            Dedicated macOS release for Bedrock Prompt Engineering Workstation.
            Native build supporting both Apple Silicon (M1/M2/M3/M4) and Intel Macs.

            ### Downloads
            - **macOS Disk Image (Installer)**: `Bedrock-Mac.dmg`
            - **macOS Application Archive**: `Bedrock-Mac.zip`

            ---

            ### First Launch Instructions (Ad-hoc Unsigned Build)
            Because this build is distributed directly without a paid Apple certificate:
            1. Open `Bedrock-Mac.dmg` and drag `Bedrock` to your `/Applications` folder.
            2. **Right-click** (or Control-click) `Bedrock.app` in Applications and click **Open**.
            3. Click **Open** on the confirmation prompt.
            *(Or in Terminal, run: `xattr -cr /Applications/Bedrock.app`)*
          files: |
            release-mac-artifacts/Bedrock-Mac.dmg
            release-mac-artifacts/Bedrock-Mac.zip
