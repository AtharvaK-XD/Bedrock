# gitleaks config for the CI secret scans (.github/workflows/security.yml).
# Uses every default rule. The only exceptions are the documented placeholder lines in the
# .env.example templates and documentation (not real secrets).
# Never allowlist a whole file: a real key pasted into an example file must still be caught.
title = "Bedrock gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Placeholder values in templates and documentation (not real secrets)"
regexTarget = "line"
regexes = [
  '''postgresql://user:(pass|password)@ep(-[a-z0-9]+)?(-pooler)?\.(us-east-[12])\.aws\.neon\.tech/''',
  '''postgresql://bedrock_app:<password>@''',
  '''postgres://(pglite-in-memory|unit-test-not-a-real-db)''',
  '''RAZORPAY_KEY_ID=rzp_live_placeholder\b''',
]
